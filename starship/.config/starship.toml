# Minimal Starship Prompt Configuration
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

add_newline = false

# Username
[username]
show_always = false
format = "[$user]($style) "
style_user = "bold cyan"

# Hostname
[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold blue"

# Directory
[directory]
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style) "
style = "bold green"

# Git Branch
[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold purple"
symbol = " "

# Git Status
[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
conflicted = "="
deleted = "✘"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!"
renamed = "»"
staged = "+"
untracked = "?"

# Command Duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

# Character
[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# Line Break
[line_break]
disabled = false
