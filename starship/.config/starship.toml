# My starship config 
format = "$directory$character: "

add_newline = false
palette = "modern_dark"

[package]
disabled = true

[directory]
home_symbol = "~"
style = "bold green"
truncation_length = 0
truncation_symbol = ""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[palettes.modern_dark]
# Base colors
bg        = "#1e1e2e"
fg        = "#cdd6f4"

# Accents
red       = "#f38ba8"
green     = "#a6e3a1"
yellow    = "#f9e2af"
blue      = "#89b4fa"
purple    = "#cba6f7"
cyan      = "#94e2d5"
orange    = "#fab387"

# Muted / subtle
muted     = "#6c7086"
surface   = "#313244"
overlay   = "#45475a"

# Special
success   = "#a6e3a1"
warning   = "#f9e2af"
error     = "#f38ba8"

